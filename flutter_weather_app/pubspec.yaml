name: skycast_weather
description: "A modern, responsive Weather Forecast Android application built with Flutter, Provider, fl_chart, and live weather API."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: ">=3.35.0"

dependencies:
  flutter:
    sdk: flutter
  
  # State Management
  provider: ^6.1.2
  
  # Networking & APIs
  http: ^1.2.1
  
  # Local Storage & Persistence
  shared_preferences: ^2.2.3
  
  # Charts & Visualizations
  fl_chart: ^0.68.0
  
  # Location & Geocoding
  geolocator: ^12.0.0
  geocoding: ^3.0.0
  
  # Date Formatting & Utilities
  intl: ^0.19.0
  
  # UI & Icons
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.10+1
  cached_network_image: ^3.3.1
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/images/
